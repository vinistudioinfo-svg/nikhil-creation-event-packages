:root{--bg:#090909;--panel:#121212;--panel2:#181818;--line:#2b2b2b;--text:#f7f3ec;--muted:#a9a39a;--gold:#c9a86a;--green:#79c79b;--red:#e18a8a;--blue:#7da7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#201b14 0,#090909 42%);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px 18px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{letter-spacing:2.5px;font-size:14px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#151515;color:var(--text);padding:11px 15px;border-radius:11px}.btn.primary{background:var(--gold);color:#17130c;border-color:var(--gold);font-weight:700}.btn.ghost{background:transparent}.btn.danger{color:#ffb5b5}.btn.small{padding:7px 10px;font-size:12px}
h1{font-size:clamp(32px,5vw,58px);line-height:1.02;margin:10px 0}.sub{color:var(--muted);line-height:1.6;max-width:800px}
.progress{display:flex;gap:7px;overflow:auto;margin-bottom:26px}.step{min-width:145px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.step.active{border-color:var(--gold);color:var(--text)}
.card,.func{background:linear-gradient(180deg,#171717,#101010);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;background:#0c0c0c;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;outline:0}textarea{min-height:85px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--gold)}

.func-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:11px;color:var(--gold);border:1px solid #66532f;border-radius:999px;padding:5px 9px}

.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.admin-nav button.active{border-color:var(--gold);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:16px;background:#121212}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.stat strong{font-size:24px}

.notice{padding:12px 14px;border:1px solid #51452f;background:#15120e;border-radius:12px;color:#dbc79e;margin:12px 0}

const SUPABASE_URL="https://tborvfqiyehqvzludpns.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_DdgBJYcShkAw6Xa_8XNLGA_drhjY5x3";
const SUPABASE_FUNCTIONS_URL=SUPABASE_URL+"/functions/v1";
async function accessTokenHash(){
  if(!state.accessToken){
    state.accessToken=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+"-"+Math.random()+"-"+Math.random());
    persist();
  }
  const bytes=new TextEncoder().encode(state.accessToken);
  const digest=await crypto.subtle.digest("SHA-256",bytes);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function supabasePayload(){
  const functions=state.selected.map(f=>{
    const d=state.data[f]||{};
    const items=[
      ...(d.services||[]).filter(x=>x.qty).map(x=>({...x,itemType:"service"})),
      ...(d.addons||[]).filter(x=>x.qty).map(x=>({...x,itemType:"function_addon"}))
    ];
    return {
      functionType:f,
      customFunctionName:f==="Custom Function"?(d.customName||"Custom Function"):null,
      eventDate:d.date||"",
      startTime:d.start||"",
      endTime:d.end||"",
      side:d.side||"",
      venue:d.venue||"",
      googleMapsUrl:d.map||"",
      fullAddress:d.address||"",
      guestCount:d.guests||"",
      specialRequirements:d.notes||"",
      items
    };
  });
  const packageAddons=Object.values(state.packageAddons||{})
    .filter(x=>x.qty)
    .map(x=>({...x,itemType:"package_addon"}));
  const album=state.packageAddons?.["Premium Album"];
  return {
    client:{
      fullName:state.client.name||"",
      mobile:state.client.mobile||"",
      email:state.client.email||""
    },
    functions,
    packageAddons,
    album:{
      selected:!!album,
      extraPages:album?.extraPages||0
    }
  };
}
async function submitEnquiryToSupabase(){
  const payload={...supabasePayload()};
  const snapshot=JSON.stringify(payload);
  if(state.enquiryId&&state.enquirySnapshot===snapshot){
    return {
      ok:true,
      enquiryId:state.enquiryId,
      enquiryNumber:state.serverEnquiryNumber,
      proposalNumber:state.serverProposalNumber,
      clientTotal:state.serverClientTotal||total(),
      unchanged:true
    };
  }
  const tokenHash=await accessTokenHash();
  payload.accessTokenHash=tokenHash;
  const res=await fetch(SUPABASE_FUNCTIONS_URL+"/submit-enquiry",{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},
    body:JSON.stringify(payload)
  });
  let data={};
  try{data=await res.json()}catch(_){}
  if(!res.ok||!data.ok)throw new Error(data.error||"Unable to save enquiry to Supabase.");
  state.enquiryId=data.enquiryId;
  state.serverEnquiryNumber=data.enquiryNumber;
  state.serverProposalNumber=data.proposalNumber;
  state.serverClientTotal=Number(data.clientTotal||total());
  state.enquirySnapshot=snapshot;
  persist();
  return data;
}
async function createBookingInSupabase(){
  if(!state.enquiryId)await submitEnquiryToSupabase();
  const hash=await accessTokenHash();
  const res=await fetch(SUPABASE_FUNCTIONS_URL+"/create-booking",{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},
    body:JSON.stringify({
      enquiryId:state.enquiryId,
      accessTokenHash:hash,
      advancePercent:50
    })
  });
  let data={};
  try{data=await res.json()}catch(_){}
  if(!res.ok||!data.ok)throw new Error(data.error||"Unable to create booking.");
  state.bookingId=data.bookingId;
  state.bookingNumber=data.bookingNumber;
  state.payment={status:"Pending",utr:"",advance:Number(data.advanceAmount||Math.round(total()*0.5))};
  persist();
  return data;
}

   id,
   enquiryId:extra.enquiryId||state.enquiryId||previous.enquiryId||"",
   enquiryNumber:extra.enquiryNumber||state.serverEnquiryNumber||previous.enquiryNumber||id,
   status,
   createdAt:previous.createdAt||new Date().toISOString(),
   updatedAt:new Date().toISOString(),
   client:structuredClone(state.client),
   selected:structuredClone(state.selected),
   data:structuredClone(state.data),
   packageAddons:structuredClone(state.packageAddons),
   listedTotal:total(),
   total:total(),
   internalCost:internalCost(),
   paymentStatus:extra.paymentStatus??previous.paymentStatus??"Pending",
   advanceAmount:extra.advanceAmount??previous.advanceAmount??0,
   amountPaid:extra.amountPaid??previous.amountPaid??previous.advanceAmount??0,
   remainingBalance:extra.remainingBalance??previous.remainingBalance??Math.max(0,total()-Number(previous.amountPaid??previous.advanceAmount??0)),
   utr:extra.utr??previous.utr??""
 };
 if(existingIndex>=0) arr[existingIndex]=record;
 else arr.push(record);
 localStorage.setItem("ncRecords",JSON.stringify(arr));
 return id;
}
let adminTab="dashboard";
function records(){return JSON.parse(localStorage.getItem("ncRecords")||"[]")}
function recordFinalTotal(x){let listed=0,cost=0;x.selected.forEach(f=>{let d=x.data[f]||{};[...(d.services||[]),...(d.addons||[])].filter(y=>y.qty).forEach(y=>{listed+=y.price*y.qty;cost+=(COST[y.name]||0)*y.qty})});Object.values(x.packageAddons||{}).filter(y=>y.qty).forEach(y=>{listed+=y.price*y.qty;cost+=(COST[y.name]||0)*y.qty});return {listed,cost,final:listed}}
function migrateRecords(){let a=records(),changed=false;a=a.map(x=>{if(!x.selected||!x.data)return x;let z=recordFinalTotal(x);if(x.listedTotal==null||x.listedTotal!==z.listed||x.total!==z.final||x.internalCost!==z.cost){changed=true;return {...x,listedTotal:z.listed,internalCost:z.cost,total:z.final}}return x});if(changed)localStorage.setItem("ncRecords",JSON.stringify(a))}
function admin(){let r=records();$("app").innerHTML=`<div class="no-print"><div class="admin-nav"><button class="btn ${adminTab==="dashboard"?"active":""}" data-at="dashboard">Dashboard</button><button class="btn ${adminTab==="enquiries"?"active":""}" data-at="enquiries">Enquiries / Bookings</button><button class="btn ${adminTab==="pricing"?"active":""}" data-at="pricing">Internal Pricing</button><button class="btn" id="print">Print Admin</button><button class="btn ghost" id="exit">Client View</button></div></div>${adminTab==="dashboard"?adminDash(r):adminTab==="enquiries"?adminRecords(r):adminPricing()}`;document.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{adminTab=b.dataset.at;admin()});$("exit")?.addEventListener("click",()=>{adminMode=false;render()});$("print")?.addEventListener("click",()=>window.print());document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRecord(b.dataset.open,r))}
function adminDash(r){let now=new Date(),month=now.getMonth(),year=now.getFullYear(),bookings=r.filter(x=>x.status==="Booking"),monthly=bookings.filter(x=>{let d=new Date(x.createdAt);return d.getMonth()===month&&d.getFullYear()===year}),yearly=bookings.filter(x=>new Date(x.createdAt).getFullYear()===year),booked=bookings;return `<h1>Admin Dashboard</h1><p class="sub">Private admin view: client selling price, package details, internal costing where configured, profit/margin and income summaries.</p><div class="stats"><div class="stat"><span>This Month Income</span><strong>${money(monthly.reduce((a,x)=>a+x.total,0))}</strong></div><div class="stat"><span>This Year Income</span><strong>${money(yearly.reduce((a,x)=>a+x.total,0))}</strong></div><div class="stat"><span>Total Bookings</span><strong>${booked.length}</strong></div><div class="stat"><span>All Enquiries</span><strong>${r.length}</strong></div><div class="stat"><span>Amount Received</span><strong>${money(r.reduce((s,x)=>s+Number(x.amountPaid??x.advanceAmount??0),0))}</strong></div><div class="stat"><span>Outstanding</span><strong>${money(r.reduce((s,x)=>s+Math.max(0,Number(x.total||0)-Number(x.amountPaid??x.advanceAmount??0)),0))}</strong></div></div><div class="card"><h3>Income by month — ${year}</h3><div class="table-wrap"><table class="table"><tr><th>Month</th><th>Enquiries</th><th>Bookings</th><th>Client Income</th></tr>${Array.from({length:12},(_,m)=>{let a=r.filter(x=>x.status==="Booking"&&new Date(x.createdAt).getMonth()===m&&new Date(x.createdAt).getFullYear()===year);return `<tr><td>${new Date(year,m,1).toLocaleString("en-IN",{month:"long"})}</td><td>${a.length}</td><td>${a.filter(x=>x.status==="Booking").length}</td><td>${money(a.reduce((s,x)=>s+x.total,0))}</td></tr>`}).join("")}</table></div></div>`}
function adminRecords(r){return `<h1>Enquiries & Bookings</h1><div class="card"><div class="table-wrap"><table class="table"><tr><th>ID</th><th>Date</th><th>Client</th><th>Status</th><th>Payment</th><th>Paid</th><th>Balance</th><th>Functions</th><th>Client Total</th><th></th></tr>${r.slice().reverse().map(x=>`<tr><td>${x.id}</td><td>${new Date(x.createdAt).toLocaleString("en-IN")}</td><td>${esc(x.client.name)}<br>${esc(x.client.mobile)}</td><td>${x.status}</td><td>${x.paymentStatus||"—"}</td><td>${money(Number(x.amountPaid??x.advanceAmount??0))}</td><td>${money(Math.max(0,Number(x.total||0)-Number(x.amountPaid??x.advanceAmount??0)))}</td><td>${x.selected.join(", ")}</td><td>${money(x.total)}</td><td><button class="btn small" data-open="${x.id}">View</button></td></tr>`).join("")||"<tr><td colspan='10'>No records.</td></tr>"}</table></div></div>`}
function internalName(clientName){return clientName}
function costFor(name){return COST[internalName(name)]}
function adminPricing(){let rows=[...Object.entries(SELL),["Premium Album",18000],["Highlight Film",15000],["Teaser Film",8000],["LED Wall / Live Screening",12000]];return `<h1>Internal Pricing</h1><p class="sub">Client prices are the selling prices. Internal costs are shown only here. Minimum target margin is 60%.</p><div class="notice">Costing items not present in your supplied internal costing are shown as <b>Not configured</b>; no cost is invented.</div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Item</th><th>Client Price</th><th>Internal Cost</th><th>Profit</th><th>Margin</th><th>Status</th></tr>${rows.map(([n,p])=>{let c=costFor(n),profit=c==null?null:p-c,margin=c==null?null:profit/p*100;return `<tr><td>${esc(n)}</td><td>${money(p)}</td><td>${c==null?"Not configured":money(c)}</td><td>${profit==null?"—":money(profit)}</td><td>${margin==null?"—":margin.toFixed(1)+"%"}</td><td>${margin==null?"<span class='warn'>Cost missing</span>":margin>=60?"<span class='good'>≥60%</span>":"<span class='warn'>&lt;60%</span>"}</tr>`}).join("")}</table></div></div>`}
function openRecord(id,r){
 let x=r.find(z=>z.id===id);if(!x)return;
 let lines=[];
 x.selected.forEach(f=>{let d=x.data[f]||{};[...(d.services||[]),...(d.addons||[])].filter(y=>y.qty).forEach(y=>lines.push({function:f,name:y.name,qty:y.qty,sell:y.price,cost:costFor(y.name)}))});
 Object.values(x.packageAddons||{}).filter(y=>y.qty).forEach(y=>lines.push({function:"Package-wide",name:y.name,qty:y.qty,sell:y.price,cost:costFor(y.name)}));
 let listedSell=lines.reduce((a,y)=>a+y.sell*y.qty,0),costKnown=lines.filter(y=>y.cost!=null).reduce((a,y)=>a+y.cost*y.qty,0),unknown=lines.some(y=>y.cost==null),sell=x.total||listedSell,profit=unknown?null:sell-costKnown,margin=profit==null?null:profit/sell*100;
 let paid=Number(x.amountPaid??x.advanceAmount??0),remaining=Math.max(0,sell-paid),payment=x.paymentStatus||"Pending";
 $("modalBox").innerHTML=`<div class="func-head"><div><h2>BOOKING DETAILS</h2><span>${esc(x.id)}</span></div><button class="btn" id="closeModal">Close</button></div>
 <p><b>${esc(x.client.name)}</b> • ${esc(x.client.mobile)} • ${esc(x.client.email)}</p>
 <p>Status: <b>${esc(x.status)}</b> • Created: ${new Date(x.createdAt).toLocaleString("en-IN")}</p>
 <div class="card" style="margin:14px 0"><h3 style="margin-top:0">PAYMENT MANAGEMENT</h3>
   <div class="stats" style="margin:10px 0"><div class="stat"><span>Package Amount</span><strong>${money(sell)}</strong></div><div class="stat"><span>Amount Paid</span><strong>${money(paid)}</strong></div><div class="stat"><span>Remaining Balance</span><strong>${money(remaining)}</strong></div><div class="stat"><span>Payment Status</span><strong>${esc(payment)}</strong></div></div>
   <p><b>UTR / Transaction ID:</b> ${esc(x.utr||"Not submitted")}</p>
   <div class="actions">
     ${payment==="Submitted"?'<button class="btn primary" id="verifyPayment">✓ Verify Payment</button>':""}
     ${payment==="Verified"?'<span class="good">✓ Payment Verified</span>':""}
     ${payment==="Submitted"?'<button class="btn ghost" id="rejectPayment">Reject / Request Recheck</button>':""}
   </div>
 </div>
 <div class="table-wrap"><table class="table"><tr><th>Function</th><th>Item</th><th>Qty</th><th>Client Price</th><th>Internal Cost</th><th>Profit</th></tr>${lines.map(y=>{let p=y.sell*y.qty,c=y.cost==null?null:y.cost*y.qty;return `<tr><td>${esc(y.function)}</td><td>${esc(y.name)}</td><td>${y.qty}</td><td>${money(p)}</td><td>${c==null?"Not configured":money(c)}</td><td>${c==null?"—":money(p-c)}</td></tr>`}).join("")}</table></div>
 <div class="total"><span>Client Total<br><span class="mini">Client sees selling price only</span></span><span class="big">${money(sell)}</span></div>
 <div class="card"><b>Internal Cost:</b> ${unknown?"Partial / not complete":money(costKnown)}<br><b>Profit:</b> ${profit==null?"Cannot calculate until all costs are configured":money(profit)}<br><b>Margin:</b> ${margin==null?"Cannot calculate":margin.toFixed(1)+"%"} ${margin!=null&&margin<60?"<span class='warn'>⚠ Below 60% target</span>":"<span class='good'>✓ 60%+ margin</span>"}</div>`;
 $("modal").classList.remove("hidden");
 $("closeModal").onclick=()=>$("modal").classList.add("hidden");
 $("verifyPayment")?.addEventListener("click",()=>{
   const a=records(),idx=a.findIndex(z=>z.id===id);
   if(idx<0)return;
   a[idx]={...a[idx],paymentStatus:"Verified",paymentVerifiedAt:new Date().toISOString()};
   localStorage.setItem("ncRecords",JSON.stringify(a));
   $("modal").classList.add("hidden");admin();
 });
 $("rejectPayment")?.addEventListener("click",()=>{
   const a=records(),idx=a.findIndex(z=>z.id===id);
   if(idx<0)return;
   a[idx]={...a[idx],paymentStatus:"Recheck Required"};
   localStorage.setItem("ncRecords",JSON.stringify(a));
   $("modal").classList.add("hidden");admin();
 });
}

  $("modal").classList.remove("hidden");

try{

 migrateRecords();
 render();

 localStorage.removeItem("ncPackage");
 state={step:0,selected:[],data:{},packageAddons:{},client:{},otp:"",verified:false};
 try{render();}catch(e2){
   console.error("Nikhil Creation render error:",e2);
   $("app").innerHTML="<div class='card'><h2>Page could not load</h2><p class='sub'>Please refresh once. If this remains, use the Admin button above.</p><button class='btn primary' onclick='location.reload()'>Refresh</button></div>";
 }
}
