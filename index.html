<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nikhil Creation | Event & Wedding Package Builder</title>
<style>
:root{--bg:#090909;--panel:#121212;--panel2:#181818;--line:#2b2b2b;--text:#f7f3ec;--muted:#a9a39a;--gold:#c9a86a;--green:#79c79b;--red:#e18a8a;--blue:#7da7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#201b14 0,#090909 42%);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px 18px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{letter-spacing:2.5px;font-size:14px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#151515;color:var(--text);padding:11px 15px;border-radius:11px}.btn.primary{background:var(--gold);color:#17130c;border-color:var(--gold);font-weight:700}.btn.ghost{background:transparent}.btn.danger{color:#ffb5b5}.btn.small{padding:7px 10px;font-size:12px}
h1{font-size:clamp(32px,5vw,58px);line-height:1.02;margin:10px 0}.sub{color:var(--muted);line-height:1.6;max-width:800px}
.progress{display:flex;gap:7px;overflow:auto;margin-bottom:26px}.step{min-width:145px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.step.active{border-color:var(--gold);color:var(--text)}
.card,.func{background:linear-gradient(180deg,#171717,#101010);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;background:#0c0c0c;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;outline:0}textarea{min-height:85px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--gold)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{background:#101010;color:var(--text);border:1px solid var(--line);border-radius:15px;padding:16px;text-align:left}.choice.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.choice small{display:block;color:var(--muted);margin-top:6px}
.func-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:11px;color:var(--gold);border:1px solid #66532f;border-radius:999px;padding:5px 9px}
.option{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;margin:7px 0;border:1px solid #292929;border-radius:12px;background:#0d0d0d}.option-left{display:flex;gap:10px;align-items:center}.price{color:#e7d3aa;font-weight:700;white-space:nowrap}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#191919;color:var(--text);border-radius:8px}.qty b{min-width:22px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 17px;border:1px solid #51452f;background:#15120e;border-radius:15px;margin-top:16px}.big{font-size:27px;font-weight:800}.muted{color:var(--muted)}.mini{font-size:12px;color:var(--muted);line-height:1.55}.empty{border:1px dashed #3b3b3b;padding:22px;border-radius:14px;color:var(--muted);text-align:center}
.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.admin-nav button.active{border-color:var(--gold);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:16px;background:#121212}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.stat strong{font-size:24px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:11px;border-bottom:1px solid #252525;text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:500}.good{color:var(--green)}.warn{color:var(--red)}
.notice{padding:12px 14px;border:1px solid #51452f;background:#15120e;border-radius:12px;color:#dbc79e;margin:12px 0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-box{max-width:850px;width:100%;max-height:90vh;overflow:auto;background:#151515;border:1px solid var(--line);border-radius:20px;padding:20px}
.hidden{display:none!important}
@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}.choice-grid,.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.actions{position:sticky;bottom:0;background:#090909ee;padding:10px 0;z-index:4}}
@media(max-width:520px){.choice-grid,.stats{grid-template-columns:1fr}.wrap{padding:16px 12px 55px}.card,.func{padding:15px}}
@media print{body{background:white;color:#111}.no-print{display:none!important}.wrap{max-width:none;padding:0}.card,.func,.stat{background:white;border:1px solid #bbb;color:#111;box-shadow:none}.muted,.mini,.sub{color:#555}.table th,.table td{border-color:#ccc}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div class="brand">NIKHIL CREATION</div>
 <div class="top-actions no-print"><button class="btn small" id="lang">मराठी</button><button class="btn small" id="adminBtn">Admin</button></div>
</header>
<div id="app"></div>
</div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<script>
const SELL={
"Candid Photographer":12000,"Traditional Photographer":7000,"Additional Photographer":7000,
"Cinematic Videographer":15000,"Traditional Video":7000,"Additional Videographer":7000,
"Drone Coverage":10000,"Same Day Edit":5000,"Live Streaming":10000,"Family Portrait Photo Booth":10000,
"Extra Hours":1000,"Extra Photographer":7000,"Extra Videographer":7000,"Reels Pack":2000
};
const FUNCTION_ADDONS=[["Extra Hours","Extend coverage beyond the selected function timing"],["Extra Photographer","Add one more photographer for parallel coverage"],["Extra Videographer","Add one more videographer for parallel coverage"],["Reels Pack","Short vertical reels from this function"],["Same Day Edit","Fast same-day highlight edit"]];
const PACKAGE_ADDONS=[["Premium Album",18000,"Premium wedding album with designed 30 pages"],["Highlight Film",15000,"Edited cinematic highlight film"],["Teaser Film",8000,"Short teaser for sharing"],["LED Wall / Live Screening",12000,"Screening setup for the celebration"]];
const SERVICE_GROUPS=[
["Photography",[["Candid Photographer","Natural moments and complete function coverage"],["Traditional Photographer","Traditional family and ritual coverage"],["Additional Photographer","Second photographer for parallel coverage"]]],
["Videography",[["Cinematic Videographer","Cinematic highlights and storytelling film"],["Traditional Video","Complete traditional video coverage"],["Additional Videographer","Second videographer for parallel coverage"]]],
["Special Coverage",[["Drone Coverage","Aerial venue and celebration shots"],["Same Day Edit","1-minute same-day reel/edit"],["Live Streaming","Live coverage for remote guests"],["Family Portrait Photo Booth","Interactive photo booth coverage"]]]
];
const FUNCTIONS=["Mehendi","Haldi","Wedding","Reception","Engagement","Pre-Wedding","Baby Shower","Birthday","Custom Function"];
// Exact internal costing supplied by the client file. Missing items are intentionally not guessed.
const COST={
"Candid Photographer":7000,"Traditional Photographer":4000,"Additional Photographer":4000,
"Cinematic Videographer":12000,"Traditional Video":5500,"Additional Videographer":5500,
"Drone Coverage":5000,"Same Day Edit":2000,"Live Streaming":9000,"Family Portrait Photo Booth":2500,
"Extra Hours":1000,"Extra Photographer":5000,"Extra Videographer":5500,"Reels Pack":1000,
"Premium Album":10500,"Highlight Film":9000,"Teaser Film":3000,"LED Wall / Live Screening":10000
};
let state={step:0,selected:[],data:{},packageAddons:{},client:{},otp:"",verified:false};
let adminMode=false;
const steps=["Verification","Functions","Details","Services","Add-ons","Review"];
const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function persist(){localStorage.setItem("ncPackage",JSON.stringify(state))}
function restore(){try{let x=JSON.parse(localStorage.getItem("ncPackage"));if(x&&typeof x==="object"&&Array.isArray(x.selected)&&x.data&&x.client&&typeof x.step==="number"&&x.step>=0&&x.step<=5){state={...state,...x};state.step=Math.min(5,Math.max(0,state.step));}else{localStorage.removeItem("ncPackage");}}catch(e){localStorage.removeItem("ncPackage");}}
function total(){let t=0;state.selected.forEach(f=>{let d=state.data[f]||{};t+=(d.services||[]).reduce((a,x)=>a+x.price*x.qty,0)+(d.addons||[]).reduce((a,x)=>a+x.price*x.qty,0)});t+=Object.values(state.packageAddons).reduce((a,x)=>a+x.price*x.qty+(x.name==="Premium Album"?(x.extraPages||0)*600*x.qty:0),0);return t}
function internalCost(){let c=0;state.selected.forEach(f=>{let d=state.data[f]||{};[...(d.services||[]),...(d.addons||[])].filter(x=>x.qty).forEach(x=>{c+=(COST[x.name]||0)*x.qty})});Object.values(state.packageAddons).filter(x=>x.qty).forEach(x=>{c+=(COST[x.name]||0)*x.qty});return c}
function finalTotal(){return total()}
function stepsBar(){return `<div class="progress no-print">${steps.map((s,i)=>`<div class="step ${i===state.step?"active":""}">${i+1}. ${s}</div>`).join("")}</div>`}
function render(){if(adminMode)return admin();$('app').innerHTML=stepsBar()+clientView();bindClient();persist();scrollTo({top:0,behavior:"smooth"})}
function back(){if(state.step>0){state.step--;render()}}
function clientView(){return [vVerify,vFunctions,vDetails,vServices,vAddons,vReview][state.step]()}
function vVerify(){return `<h1>Build your event package.</h1><p class="sub">Verify your details once. Your enquiry can be reopened later without filling everything again.</p>
<div class="card"><div class="grid"><div class="field"><label>Full Name</label><input id="name" value="${esc(state.client.name)}"></div><div class="field"><label>Mobile</label><input id="mobile" value="${esc(state.client.mobile)}"></div><div class="field"><label>Email</label><input id="email" value="${esc(state.client.email)}"></div></div>
<div class="actions"><span></span><button class="btn primary" id="send">Send OTP</button></div>
<div class="${state.otp?"":"hidden"}" id="otpArea"><div class="field"><label>OTP</label><input id="otp" maxlength="6" placeholder="6 digit OTP"></div><div class="actions"><button class="btn ghost" id="otpBack">Back</button><button class="btn primary" id="verify">Verify & Continue</button></div><p class="mini">Demo OTP: <b>${state.otp||""}</b>. Connect a real OTP provider in production.</p></div></div>`}
function vFunctions(){return `<h1>Select functions.</h1><p class="sub">Select as many functions as needed. Every function has independent details, services, add-ons and total.</p><div class="choice-grid">${FUNCTIONS.map(f=>`<button class="choice ${state.selected.includes(f)?"on":""}" data-func="${esc(f)}"><b>${esc(f)}</b><small>${state.selected.includes(f)?"Selected":"Add function"}</small></button>`).join("")}</div><div class="card"><b>Selected:</b> <span class="mini">${state.selected.length?state.selected.map(esc).join(" • "):"None"}</span></div><div class="actions"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="toDetails" ${state.selected.length?"":"disabled"}>Continue →</button></div>`}
function vDetails(){return `<h1>Function details.</h1><p class="sub">Venue, date, timing, side, map and guest count are saved separately for every function.</p>${state.selected.map((f,i)=>{let d=state.data[f]||{};return `<div class="func"><div class="func-head"><b>${i+1}. ${esc(f)}</b><span class="pill">Independent details</span></div><div class="grid" style="margin-top:15px">
${field("Date","date",d.date,f,"date")}${field("Start Time","start",d.start,f,"time")}${field("End Time","end",d.end,f,"time")}<div class="field"><label>Side</label><select data-detail="side" data-f="${esc(f)}"><option ${d.side==="Bride Side"?"selected":""}>Bride Side</option><option ${d.side==="Groom Side"?"selected":""}>Groom Side</option><option ${d.side==="Both Sides"?"selected":""}>Both Sides</option></select></div>
${field("Venue Name","venue",d.venue,f)}${field("Google Maps / Location","map",d.map,f)}${field("Full Address","address",d.address,f)}${field("Guest Count","guests",d.guests,f,"number")}</div><div class="field" style="margin-top:13px"><label>Special Requirements</label><textarea data-detail="notes" data-f="${esc(f)}">${esc(d.notes||"")}</textarea></div></div>`}).join("")}<div class="actions"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="toServices">Continue →</button></div>`}
function field(label,key,val,f,type="text"){return `<div class="field"><label>${label}</label><input type="${type}" data-detail="${key}" data-f="${esc(f)}" value="${esc(val||"")}"></div>`}
function getQty(list,name){let x=(list||[]).find(x=>x.name===name);return x?.qty||0}
function row(name,desc,price,f,key){let d=state.data[f]||{},list=d[key]||[],q=getQty(list,name);return `<div class="option"><div><div class="option-left"><b>${esc(name)}</b></div><div class="mini">${esc(desc)}</div></div><div class="qty"><span class="price">${money(price)}</span><button data-qty="minus" data-key="${key}" data-name="${esc(name)}" data-f="${esc(f)}">−</button><b>${q}</b><button data-qty="plus" data-key="${key}" data-name="${esc(name)}" data-f="${esc(f)}">+</button></div></div>`}
function setQty(f,key,name,price,delta){state.data[f]??={};state.data[f][key]??=[];let a=state.data[f][key],x=a.find(x=>x.name===name);if(!x&&delta>0){x={name,price,qty:0};a.push(x)}if(x){x.qty=Math.max(0,x.qty+delta);if(x.qty===0)state.data[f][key]=a.filter(y=>y.name!==name)}persist()}
function vServices(){return `<h1>Services / सेवा</h1><p class="sub">Services are function-wise. Choosing a service for Mehendi does not add it to Wedding.</p>${state.selected.map(f=>`<div class="func"><div class="func-head"><b>${esc(f)}</b><span class="pill">${money(((state.data[f]?.services)||[]).reduce((a,x)=>a+x.price*x.qty,0))}</span></div>${SERVICE_GROUPS.map(g=>`<h3>${g[0]}</h3>${g[1].map(x=>row(x[0],x[1],SELL[x[0]],f,"services")).join("")}`).join("")}</div>`).join("")}<div class="actions"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="toAddons">Continue →</button></div>`}
function vAddons(){return `<h1>Add-ons / अ‍ॅड-ऑन्स</h1><p class="sub">Function add-ons apply only to that function. Package-wide add-ons are added once to the complete event package.</p>${state.selected.map(f=>`<div class="func"><div class="func-head"><b>${esc(f)} ADD-ONS</b><span class="pill">Function Add-ons Total ${money(((state.data[f]?.addons)||[]).reduce((a,x)=>a+x.price*x.qty,0))}</span></div>${FUNCTION_ADDONS.map(x=>row(x[0],x[1],SELL[x[0]],f,"addons")).join("")}</div>`).join("")}<div class="card"><div class="func-head"><b>PACKAGE-WIDE / Overall Add-ons</b><span class="pill">Added once to the complete package</span></div><p class="mini">Premium Album includes <b>30 pages, 12×36 mini book, calendar and 12×18 frame</b>. If the client wants more album pages, additional pages are <b>₹600 per page</b>.</p>${PACKAGE_ADDONS.map(x=>{let q=state.packageAddons[x[0]]?.qty||0;let ep=state.packageAddons[x[0]]?.extraPages||0;return `<div class="option"><div><b>${esc(x[0])}</b><div class="mini">${x[0]==="Premium Album"?"Premium 30-page album • 12×36 mini book • Calendar • 12×18 frame • Extra pages ₹600/page":esc(x[2])}</div></div><div class="qty"><span class="price">${money(x[1])}</span><button data-pqty="minus" data-name="${esc(x[0])}" data-price="${x[1]}">−</button><b>${q}</b><button data-pqty="plus" data-name="${esc(x[0])}" data-price="${x[1]}">+</button></div></div>${x[0]==="Premium Album"&&q?`<div class="album-extra"><b>Included:</b> 30 pages • 12×36 mini book • calendar • 12×18 frame<br><b>Add extra pages:</b> ₹600 per page <span class="qty"><button data-album-pages="minus">−</button><b>${ep}</b><button data-album-pages="plus">+</button></span>${ep?` <span class="price">= ${money(ep*600*q)}</span>`:""}</div>`:""}`}).join("")}</div><div class="actions"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="toReview">Review Package →</button></div>`}
function vReview(){return `<h1>Review your package.</h1><p class="sub">Everything can be edited using Back before final booking.</p><div class="card"><b>Client</b><p>${esc(state.client.name)}<br>${esc(state.client.mobile)}<br>${esc(state.client.email)}</p></div>${state.selected.map(f=>{let d=state.data[f]||{},items=[...(d.services||[]),...(d.addons||[])].filter(x=>x.qty);return `<div class="func"><div class="func-head"><b>${esc(f)}</b><span class="price">${money(items.reduce((a,x)=>a+x.price*x.qty,0))}</span></div><p class="mini">${esc(d.date||"Date not set")} • ${esc(d.start||"")}–${esc(d.end||"")} • ${esc(d.side||"")}<br>${esc(d.venue||"Venue not set")} ${d.address?"• "+esc(d.address):""}</p>${items.map(x=>`<div class="option"><span>${esc(x.name)} × ${x.qty}</span><span class="price">${money(x.price*x.qty)}</span></div>`).join("")||"<div class="empty">No services/add-ons.</div>"}</div>`}).join("")}<div class="card"><b>Package-wide Add-ons</b>${Object.values(state.packageAddons).filter(x=>x.qty).map(x=>`<div class="option"><span>${esc(x.name)} × ${x.qty}</span><span class="price">${money(x.price*x.qty+(x.name==="Premium Album"?(x.extraPages||0)*600:0))}</span></div>${x.name==="Premium Album"?`<div class="mini"><b>Includes:</b> Premium 30 pages • 12×36 mini book • calendar • 12×18 frame${x.extraPages?`<br><b>Extra pages:</b> ${x.extraPages} × ₹600 = ${money(x.extraPages*600*x.qty)}`:""}</div>`:""}`).join("")||"<p class="mini">None selected.</p>"}</div><div class="total"><span>CLIENT PACKAGE TOTAL</span><span class="big">${money(total())}</span></div><div class="actions"><button class="btn ghost" id="back">← Back</button><button class="btn ghost" id="clientPrint">Print / Share Client Copy</button><button class="btn primary" id="enquiry">Save Enquiry</button><button class="btn primary" id="book">Proceed to Final Booking</button></div>`}
const QR_BITS_B64="Af3+jhR/gkEJbKDddGdtF26UUoLLt1SMe/XYI49qqg/1VVVV/AOTeQAADJn3LVXF+FhxHvU6c4xmN3OLmpMfeYz0NjpZVoZ/rZzV7/VzIo+9pV42cbVqh/STL9eo7WPvnPp0ftz7+UltDCUgetIzy/Wx/IK9pfAHDKvi9Rb64kPBsG3nlfm1G/htALFqW0IvkfgO+oBrBogE+74WW114dnDbvWmRVbIgC/YA+4/SjH8j951UIKLLaGI3TxJV/4ujTyOVHdKNLN1aCVoWyPv8mboKxA==";
function qrSvg(){const raw=atob(QR_BITS_B64);let bits="";for(let i=0;i<raw.length;i++)bits+=raw.charCodeAt(i).toString(2).padStart(8,"0");bits=bits.slice(-1681);let s='<svg class="qr" viewBox="0 0 41 41" xmlns="http://www.w3.org/2000/svg" aria-label="UPI QR code"><rect width="41" height="41" fill="#fff"/>';for(let i=0;i<bits.length;i++)if(bits[i]==="1"){const x=i%41,y=Math.floor(i/41);s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`}return s+"</svg>"}
function clientPrint(){
 const lines=state.selected.map(f=>{let d=state.data[f]||{};return {f:f,d:d,services:d.services||[],addons:d.addons||[]}}), totalAmt=total(), packageId='NC-'+Date.now().toString(36).toUpperCase();
 const rows=lines.map((x,idx)=>{
   const items=[...x.services,...x.addons].filter(y=>y.qty), fnTotal=items.reduce((a,y)=>a+y.price*y.qty,0);
   let h='<section class="print-func"><div class="func-title"><div><span class="eyebrow">FUNCTION '+String(idx+1).padStart(2,'0')+'</span><h2>'+esc(x.f)+'</h2></div><strong>'+money(fnTotal)+'</strong></div>';
   h+='<div class="event-grid"><div><span>Date</span><b>'+esc(x.d.date||'—')+'</b></div><div><span>Time</span><b>'+esc(x.d.start||'—')+' – '+esc(x.d.end||'—')+'</b></div><div><span>Side</span><b>'+esc(x.d.side||'—')+'</b></div><div><span>Guests</span><b>'+esc(x.d.guests||'—')+'</b></div><div class="wide"><span>Venue</span><b>'+esc(x.d.venue||'—')+'</b></div><div class="wide"><span>Address / Location</span><b>'+esc(x.d.address||'—')+'</b></div>';
   if(x.d.map)h+='<div class="wide"><span>Google Maps / Location</span><b>'+esc(x.d.map)+'</b></div>';
   if(x.d.notes)h+='<div class="wide"><span>Special Requirements</span><b>'+esc(x.d.notes)+'</b></div>';
   h+='</div><table><thead><tr><th>Service / Add-on</th><th>Qty</th><th>Amount</th></tr></thead><tbody>';
   h+=items.map(y=>'<tr><td>'+esc(y.name)+'</td><td>'+y.qty+'</td><td>'+money(y.price*y.qty)+'</td></tr>').join('')||'<tr><td colspan="3" class="center">No services/add-ons selected.</td></tr>';
   return h+'</tbody></table></section>';
 }).join('');
 const pkgItems=Object.values(state.packageAddons).filter(x=>x.qty);
 const pkg=pkgItems.map(x=>'<tr><td><b>'+esc(x.name)+'</b>'+(x.name==='Premium Album'?'<div class="small-note">Includes: 30 pages • 12×36 mini book • calendar • 12×18 frame'+(x.extraPages?'<br>Extra pages: '+x.extraPages+' × ₹600':'')+'</div>':'')+'</td><td>'+x.qty+'</td><td>'+money(x.price*x.qty+(x.name==='Premium Album'?(x.extraPages||0)*600*x.qty:0))+'</td></tr>').join('')||'<tr><td colspan="3" class="center">None selected</td></tr>';
 const w=window.open('','_blank','width=980,height=1000'); if(!w)return alert('Please allow pop-ups to print the package.');

 const html='<!doctype html><html><head><title>Nikhil Creation | Event & Wedding Package</title><style>'+css+'</style></head><body><main class="sheet"><header class="header"><img class="logo" src="'+location.origin+'/assets/nikhil-logo.jpg" alt="Nikhil Photography"><div class="tagline">Event & Wedding Packages • Capturing Your Special Moments</div></header><div class="meta"><span>Package ID: <b>'+packageId+'</b></span><span class="proposal"><b>PROPOSAL</b><span>Date: '+new Date().toLocaleDateString('en-IN')+'</span></span></div><section class="section-box"><h3 class="section-title">Client Details</h3><div class="client-grid"><div class="client-item"><span>Name</span><b>'+esc(state.client.name||'—')+'</b></div><div class="client-item"><span>Mobile</span><b>'+esc(state.client.mobile||'—')+'</b></div><div class="client-item"><span>Email</span><b>'+esc(state.client.email||'—')+'</b></div><div class="client-item"><span>Functions</span><b>'+esc(state.selected.join(', ')||'—')+'</b></div></div></section>'+rows+'<section class="section-box"><h3 class="section-title">Package-wide Add-ons</h3><table><thead><tr><th>Add-on</th><th>Qty</th><th>Amount</th></tr></thead><tbody>'+pkg+'</tbody></table></section>'+(pkgItems.some(x=>x.name==='Premium Album')?'<section class="album-box"><div class="album-flex"><div><h3>Premium Album — Included in Selected Package</h3><ul><li>Premium <b>30 Pages Album</b></li><li><b>12×36 Mini Book</b></li><li><b>Calendar</b></li><li><b>12×18 Frame</b></li></ul></div><div class="extra-pages"><b>Want extra album pages?</b><strong>₹600 / page</strong><span class="small-note">Additional pages can be added as required.</span></div></div></section>':'')+'<div class="grand"><span>FINAL PACKAGE AMOUNT</span><strong>'+money(totalAmt)+'</strong></div><div class="words">This amount reflects the selected services, function-wise coverage and package-wide add-ons.</div><section class="section-box"><div class="payment-grid"><div class="payment"><h3>Payment Details</h3 }\nfunction bindClient(){
$("back")?.addEventListener("click",back);$("clientPrint")?.addEventListener("click",clientPrint);
$("send")?.addEventListener("click",()=>{state.client={name:$("name").value.trim(),mobile:$("mobile").value.trim(),email:$("email").value.trim()};if(!state.client.name||!state.client.mobile||!state.client.email)return alert("Fill all client details.");state.otp=String(Math.floor(100000+Math.random()*900000));render()});

document.querySelectorAll("[data-func]").forEach(b=>b.onclick=()=>{let f=b.dataset.func;state.selected=state.selected.includes(f)?state.selected.filter(x=>x!==f):[...state.selected,f];render()});

document.querySelectorAll("[data-pqty]").forEach(b=>b.onclick=()=>{let n=b.dataset.name,q=state.packageAddons[n]?.qty||0;state.packageAddons[n]={name:n,price:+b.dataset.price,qty:Math.max(0,q+(b.dataset.pqty==="plus"?1:-1)),extraPages:state.packageAddons[n]?.extraPages||0};if(!state.packageAddons[n].qty)delete state.packageAddons[n];render()});

function saveRecord(status){let arr=JSON.parse(localStorage.getItem("ncRecords")||"[]"),id="NC-"+Date.now().toString(36).toUpperCase();arr.push({id,status,createdAt:new Date().toISOString(),client:structuredClone(state.client),selected:structuredClone(state.selected),data:structuredClone(state.data),packageAddons:structuredClone(state.packageAddons),listedTotal:total(),total:total(),internalCost:internalCost()});localStorage.setItem("ncRecords",JSON.stringify(arr))}
let adminTab="dashboard";
function records(){return JSON.parse(localStorage.getItem("ncRecords")||"[]")}
function recordFinalTotal(x){let listed=0,cost=0;x.selected.forEach(f=>{let d=x.data[f]||{};[...(d.services||[]),...(d.addons||[])].filter(y=>y.qty).forEach(y=>{listed+=y.price*y.qty;cost+=(COST[y.name]||0)*y.qty})});Object.values(x.packageAddons||{}).filter(y=>y.qty).forEach(y=>{listed+=y.price*y.qty;cost+=(COST[y.name]||0)*y.qty});return {listed,cost,final:listed}}
function migrateRecords(){let a=records(),changed=false;a=a.map(x=>{if(!x.selected||!x.data)return x;let z=recordFinalTotal(x);if(x.listedTotal==null||x.listedTotal!==z.listed||x.total!==z.final||x.internalCost!==z.cost){changed=true;return {...x,listedTotal:z.listed,internalCost:z.cost,total:z.final}}return x});if(changed)localStorage.setItem("ncRecords",JSON.stringify(a))}
function admin(){let r=records();$("app").innerHTML=`<div class="no-print"><div class="admin-nav"><button class="btn ${adminTab==="dashboard"?"active":""}" data-at="dashboard">Dashboard</button><button class="btn ${adminTab==="enquiries"?"active":""}" data-at="enquiries">Enquiries / Bookings</button><button class="btn ${adminTab==="pricing"?"active":""}" data-at="pricing">Internal Pricing</button><button class="btn" id="print">Print Admin</button><button class="btn ghost" id="exit">Client View</button></div></div>${adminTab==="dashboard"?adminDash(r):adminTab==="enquiries"?adminRecords(r):adminPricing()}`;document.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{adminTab=b.dataset.at;admin()});$("exit")?.addEventListener("click",()=>{adminMode=false;render()});$("print")?.addEventListener("click",()=>window.print());document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRecord(b.dataset.open,r))}
function adminDash(r){let now=new Date(),month=now.getMonth(),year=now.getFullYear(),bookings=r.filter(x=>x.status==="Booking"),monthly=bookings.filter(x=>{let d=new Date(x.createdAt);return d.getMonth()===month&&d.getFullYear()===year}),yearly=bookings.filter(x=>new Date(x.createdAt).getFullYear()===year),booked=bookings;return `<h1>Admin Dashboard</h1><p class="sub">Private admin view: client selling price, package details, internal costing where configured, profit/margin and income summaries.</p><div class="stats"><div class="stat"><span>This Month Income</span><strong>${money(monthly.reduce((a,x)=>a+x.total,0))}</strong></div><div class="stat"><span>This Year Income</span><strong>${money(yearly.reduce((a,x)=>a+x.total,0))}</strong></div><div class="stat"><span>Total Bookings</span><strong>${booked.length}</strong></div><div class="stat"><span>All Enquiries</span><strong>${r.length}</strong></div></div><div class="card"><h3>Income by month — ${year}</h3><div class="table-wrap"><table class="table"><tr><th>Month</th><th>Enquiries</th><th>Bookings</th><th>Client Income</th></tr>${Array.from({length:12},(_,m)=>{let a=r.filter(x=>x.status==="Booking"&&new Date(x.createdAt).getMonth()===m&&new Date(x.createdAt).getFullYear()===year);return `<tr><td>${new Date(year,m,1).toLocaleString("en-IN",{month:"long"})}</td><td>${a.length}</td><td>${a.filter(x=>x.status==="Booking").length}</td><td>${money(a.reduce((s,x)=>s+x.total,0))}</td></tr>`}).join("")}</table></div></div>`}
function adminRecords(r){return `<h1>Enquiries & Bookings</h1><div class="card"><div class="table-wrap"><table class="table"><tr><th>ID</th><th>Date</th><th>Client</th><th>Status</th><th>Functions</th><th>Client Total</th><th></th></tr>${r.slice().reverse().map(x=>`<tr><td>${x.id}</td><td>${new Date(x.createdAt).toLocaleString("en-IN")}</td><td>${esc(x.client.name)}<br>${esc(x.client.mobile)}</td><td>${x.status}</td><td>${x.selected.join(", ")}</td><td>${money(x.total)}</td><td><button class="btn small" data-open="${x.id}">View</button></td></tr>`).join("")||"<tr><td colspan='7'>No records.</td></tr>"}</table></div></div>`}
function internalName(clientName){return clientName}
function costFor(name){return COST[internalName(name)]}
function adminPricing(){let rows=[...Object.entries(SELL),["Premium Album",18000],["Highlight Film",15000],["Teaser Film",8000],["LED Wall / Live Screening",12000]];return `<h1>Internal Pricing</h1><p class="sub">Client prices are the selling prices. Internal costs are shown only here. Minimum target margin is 60%.</p><div class="notice">Costing items not present in your supplied internal costing are shown as <b>Not configured</b>; no cost is invented.</div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Item</th><th>Client Price</th><th>Internal Cost</th><th>Profit</th><th>Margin</th><th>Status</th></tr>${rows.map(([n,p])=>{let c=costFor(n),profit=c==null?null:p-c,margin=c==null?null:profit/p*100;return `<tr><td>${esc(n)}</td><td>${money(p)}</td><td>${c==null?"Not configured":money(c)}</td><td>${profit==null?"—":money(profit)}</td><td>${margin==null?"—":margin.toFixed(1)+"%"}</td><td>${margin==null?"<span class='warn'>Cost missing</span>":margin>=60?"<span class='good'>≥60%</span>":"<span class='warn'>&lt;60%</span>"}</tr>`}).join("")}</table></div></div>`}
function openRecord(id,r){let x=r.find(z=>z.id===id);if(!x)return;let lines=[];x.selected.forEach(f=>{let d=x.data[f]||{};[...(d.services||[]),...(d.addons||[])].filter(y=>y.qty).forEach(y=>lines.push({function:f,name:y.name,qty:y.qty,sell:y.price,cost:costFor(y.name)}))});Object.values(x.packageAddons||{}).filter(y=>y.qty).forEach(y=>lines.push({function:"Package-wide",name:y.name,qty:y.qty,sell:y.price,cost:costFor(y.name)}));let listedSell=lines.reduce((a,y)=>a+y.sell*y.qty,0),costKnown=lines.filter(y=>y.cost!=null).reduce((a,y)=>a+y.cost*y.qty,0),unknown=lines.some(y=>y.cost==null),sell=x.total||listedSell,adjustment=0,profit=unknown?null:sell-costKnown,margin=profit==null?null:profit/sell*100;$("modalBox").innerHTML=`<div class="func-head"><h2>${x.id}</h2><button class="btn" id="closeModal">Close</button></div><p>${esc(x.client.name)} • ${esc(x.client.mobile)} • ${esc(x.client.email)}</p><p>Status: <b>${x.status}</b> • Created: ${new Date(x.createdAt).toLocaleString("en-IN")}</p><div class="table-wrap"><table class="table"><tr><th>Function</th><th>Item</th><th>Qty</th><th>Client Price</th><th>Internal Cost</th><th>Profit</th></tr>${lines.map(y=>{let p=y.sell*y.qty,c=y.cost==null?null:y.cost*y.qty;return `<tr><td>${esc(y.function)}</td><td>${esc(y.name)}</td><td>${y.qty}</td><td>${money(p)}</td><td>${c==null?"Not configured":money(c)}</td><td>${c==null?"—":money(p-c)}</td></tr>`}).join("")}</table></div><div class="total"><span>Client Total<br><span class="mini">Client sees selling price only</span></span><span class="big">${money(sell)}</span></div><div class="card"><b>Internal Cost:</b> ${unknown?"Partial / not complete":money(costKnown)}<br><b>Profit:</b> ${profit==null?"Cannot calculate until all costs are configured":money(profit)}<br><b>Margin:</b> ${margin==null?"Cannot calculate":margin.toFixed(1)+"%"} ${margin!=null&&margin<60?"<span class='warn'>⚠ Below 60% target</span>":"<span class='good'>✓ 60%+ margin</span>"}</div>`;$("modal").classList.remove("hidden");$("closeModal").onclick=()=>$("modal").classList.add("hidden")}
restore();migrateRecords();render();
